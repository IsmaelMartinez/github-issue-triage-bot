name: Seed Database

on:
  workflow_dispatch:
    inputs:
      seed_type:
        description: 'Seed type (troubleshooting, issues, features)'
        required: true
        type: choice
        options:
          - features
          - troubleshooting
          - issues
      data_file:
        description: 'Path to seed data file (e.g. data/feature-index.json)'
        required: true
        default: 'data/feature-index.json'

permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version-file: go.mod

      - name: Build seed binary
        run: go build -o seed ./cmd/seed

      - name: Run seed
        env:
          DATABASE_URL: ${{ secrets.TF_VAR_DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.TF_VAR_GEMINI_API_KEY }}
          SEED_TYPE: ${{ inputs.seed_type }}
          DATA_FILE: ${{ inputs.data_file }}
        run: ./seed "$SEED_TYPE" "$DATA_FILE"
